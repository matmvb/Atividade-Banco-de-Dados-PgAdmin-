<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Escola Megamente</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="login-box">
    <h1>🧠 Escola Megamente</h1>
    <p style="text-align:center;color:#666">Unidade Porto Velho</p>

    <p>Entrar como:</p>

    <div class="perfil-opcao" onclick="escolherPerfil(this)" data-perfil="secretaria">
        🗂️ <b>Secretaria</b> <span style="font-size:12px;color:#666">— cadastros e matrículas</span>
    </div>
    <div class="perfil-opcao" onclick="escolherPerfil(this)" data-perfil="professor">
        📘 <b>Professor</b> <span style="font-size:12px;color:#666">— lançar presenças</span>
    </div>
    <div class="perfil-opcao" onclick="escolherPerfil(this)" data-perfil="direcao">
        🏛️ <b>Direção</b> <span style="font-size:12px;color:#666">— ranking e financeiro</span>
    </div>

    <label>E-mail</label>
    <input type="text" id="email" value="renata@megamente.com.br">

    <label>Senha</label>
    <input type="password" id="senha" value="123456">

    <button onclick="entrar()">Entrar</button>
    <div class="erro" id="loginErro">Erro</div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
